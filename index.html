<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Search Router</title>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var q = params.get("q");
  if (!q) return;
  var words = q.trim().split(/\s+/);
  if (words.length <= 3) {
    window.location.replace("https://www.google.com/search?q=" + encodeURIComponent(q) + "&udm=14");
  } else {
    window.location.replace("https://www.perplexity.ai/search/new?q=" + encodeURIComponent(q) + "&focus=internet&copilot=true");
  }
})();
</script>
</head>
<body></body>
</html>
